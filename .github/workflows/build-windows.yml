name: 🚀 Build Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "feature/build-windows*"
      - "feature/build-windows/**"

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight-locales:
    name: "🔍 Preflight: Check Locales"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🌐 Check locales
        run: node scripts/check_locales.cjs

  preflight-typecheck:
    name: "🔍 Preflight: Typecheck"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🛡️ Typecheck
        run: npm run typecheck

  build-windows:
    name: "🏗️ Build: Windows"
    needs: [preflight-locales, preflight-typecheck]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-latest-windows

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 💾 Cache Tauri tooling
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-deps-windows-latest-${{ hashFiles('package-lock.json', '**/Cargo.toml') }}
          restore-keys: |
            tauri-deps-windows-latest-

      # Keep the private key out of PR code, dependency scripts, and third-party actions.
      - name: 🔐 Check signing availability
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Build app (Unsigned CI)
        if: github.event_name == 'pull_request' || steps.signing.outputs.available != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json 2>&1 | tee "build-windows.log"

      - name: 📜 Print unsigned build logs on failure
        if: failure() && (github.event_name == 'pull_request' || steps.signing.outputs.available != 'true')
        shell: bash
        run: |
          echo "=== UNSIGNED BUILD LOG ==="
          if [ -f "build-windows.log" ]; then
            tail -n 200 "build-windows.log"
          else
            echo "Log file not found"
          fi

      - name: 🏗️ Build app (Signed)
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --ci 2>&1 | tee "build-windows.log"

      - name: 📜 Print signed build logs on failure
        if: failure() && github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          echo "=== BUILD LOG (SIGNED) ==="
          if [ -f "build-windows.log" ]; then
            tail -n 200 "build-windows.log"
          else
            echo "Log file not found"
          fi

      - name: 📊 Summarize build warnings
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          log_file="build-windows.log"
          warnings_file="warnings-windows.txt"

          if [ ! -f "$log_file" ]; then
            : > "$warnings_file"
            {
              echo "### 🏗️ Build Summary: Windows"
              echo
              echo "❌ **The build did not produce a log; warning analysis is unavailable.**"
              echo
              echo "---"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Cargo emits ANSI color codes in CI, so normalize the log before matching.
          if sed $'s/\033\\[[0-9;]*m//g' "$log_file" | grep -n "^warning:" > "$warnings_file"; then
            warning_count="$(wc -l < "$warnings_file" | tr -d ' ')"
          else
            : > "$warnings_file"
            warning_count="0"
          fi

          {
            echo "### 🏗️ Build Summary: Windows"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ **Build failed with ${warning_count} warning(s).**"
            elif [ "${warning_count}" -eq "0" ]; then
              echo "✅ **Build completed with 0 warnings.**"
            else
              echo "⚠️ **Build completed with ${warning_count} warning(s).**"
            fi

            if [ -s "$warnings_file" ]; then
              echo
              echo "<details>"
              echo "<summary>🔍 Show warning logs (up to 200 lines)</summary>"
              echo
              echo '```text'
              sed -n '1,200p' "$warnings_file"
              echo '```'
              echo "</details>"
            fi
            echo
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-windows.log
            warnings-windows.txt

      - name: 📤 Upload build bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          retention-days: 7
          if-no-files-found: error
          path: target/release/bundle
